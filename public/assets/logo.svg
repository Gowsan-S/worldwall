<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="kwallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Orbital Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#kwallGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.6" />
  
  <!-- Inner Glow Ring -->
  <circle cx="50" cy="50" r="36" stroke="#38bdf8" stroke-width="1.2" opacity="0.3" filter="url(#glow)" />

  <!-- Global Grid Lines -->
  <ellipse cx="50" cy="50" rx="36" ry="14" stroke="url(#kwallGrad)" stroke-width="1.5" opacity="0.4" />
  <ellipse cx="50" cy="50" rx="16" ry="36" stroke="url(#kwallGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Central 'K' Glyph stylized as connected nodes -->
  <!-- Vertical spine -->
  <path d="M38 28 V72" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  
  <!-- Diagonal branches -->
  <path d="M64 30 L40 50 L64 70" stroke="url(#kwallGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Connected Global Nodes (Human Points) -->
  <circle cx="38" cy="28" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="38" cy="72" r="4.5" fill="#6366f1" filter="url(#glow)" />
  <circle cx="64" cy="30" r="4" fill="#a855f7" filter="url(#glow)" />
  <circle cx="64" cy="70" r="4" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="40" cy="50" r="3.5" fill="#ffffff" />
</svg>
